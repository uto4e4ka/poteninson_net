# Релиз: каждый push в main (слияние dev → main). Версия — из pyproject.toml.
# Тесты → сборка → публикация на PyPI (Trusted Publishing, без токенов) → тег vX.Y.Z и GitHub Release.
# Если тег этой версии уже есть — версию забыли поднять: релиз пропускается, ничего не публикуется.
name: release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - run: python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi                 # то же имя, что в «pending publisher» на PyPI
    permissions:
      contents: write                 # тег и GitHub Release
      id-token: write                 # Trusted Publishing на PyPI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # нужны теги
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Версия и проверка, что её ещё не выпускали
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::v$VERSION уже выпущена — поднимите version в pyproject.toml, чтобы выпустить новую"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка (wheel и sdist)
        if: steps.version.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Публикация на PyPI
        if: steps.version.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Тег и GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
