# Тесты: на каждый PR в main и на push в dev — чтобы сломанное не доехало до релиза
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Установить пакет и зависимости для тестов
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Тесты
        run: python -m pytest -q
