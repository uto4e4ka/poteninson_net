[project]
name = "potehinsonnet"
version = "0.19.0"
description = "Плагины для Discord-бота Potehinson: команды, кнопки, веб-панель и данные через NATS"
authors = [
    {name = "Azhestkov"}
]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["discord", "bot", "plugins", "nats"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "nats-py (>=2.15.0,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
]


[project.urls]
Repository = "https://github.com/uto4e4ka/poteninson_net"
Issues = "https://github.com/uto4e4ka/poteninson_net/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["potehinsonnet"]
